<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPulse - CI/CD avec GitHub Actions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">⚡ DevPulse</div>
            <ul class="nav-links">
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#apropos">À propos</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="accueil" class="hero">
            <h1>Bienvenue sur DevPulse</h1>
            <p>Un site statique déployé avec GitHub Actions 🚀</p>
            <button class="cta-button">Découvrir</button>
        </section>

        <section id="apropos" class="features">
            <h2>Nos fonctionnalités</h2>
            <div class="feature-grid">
                <div class="feature-card">
                    <h3>⚡ Rapide</h3>
                    <p>Des performances optimales pour votre site.</p>
                </div>
                <div class="feature-card">
                    <h3>🔒 Sécurisé</h3>
                    <p>Protection de bout en bout.</p>
                </div>
                <div class="feature-card">
                    <h3>📱 Responsive</h3>
                    <p>Compatible tous appareils.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p id="footer-content">Chargement...</p>
    </footer>

    <script src="app.js"></script>
    <script src="env.js"></script>
</body>
</html>
